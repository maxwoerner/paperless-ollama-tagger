[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperless-ollama-tagger"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx", "pydantic>=2", "pydantic-settings", "croniter"]

[project.optional-dependencies]
dev = ["pytest", "respx"]

[project.scripts]
tagger = "tagger.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
